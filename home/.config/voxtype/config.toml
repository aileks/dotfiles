engine = "whisper"
state_file = "auto"

[hotkey]
enabled = false

[audio]
device = "default"
max_duration_secs = 60

[whisper]
model = "large-v3-turbo"
language = "en"
on_demand_loading = true

[output]
mode = "type"
driver_order = ["dotool", "xclip"]
dotool_xkb_layout = "us"
fallback_to_clipboard = true
pre_type_delay_ms = 250
auto_submit = false

[output.notification]
on_recording_start = true
on_recording_stop = true
on_transcription = false
