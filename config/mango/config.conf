env=PATH,~/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
env=XDG_SESSION_TYPE,wayland
env=XDG_CURRENT_DESKTOP,mango:wlroots
env=XDG_SESSION_DESKTOP,mango
env=XKB_CONFIG_EXTRA_PATH,~/.config/xkb
env=QT_QPA_PLATFORM,wayland;xcb
env=QT_QPA_PLATFORMTHEME,qt6ct
env=LIBVA_DRIVER_NAME,nvidia
env=NVD_BACKEND,direct
env=__GLX_VENDOR_LIBRARY_NAME,nvidia
env=ELECTRON_OZONE_PLATFORM_HINT,wayland
env=GDK_BACKEND,wayland,x11,*
env=SDL_VIDEODRIVER,wayland
env=CLUTTER_BACKEND,wayland
env=XCURSOR_THEME,Adwaita
env=XCURSOR_SIZE,24
env=EDITOR,nvim
env=VISUAL,nvim
env=BEMOJI_PICKER_CMD,rofi -dmenu -i -p Emoji
env=BEMOJI_CLIP_CMD,wl-copy

exec-once=dbus-update-activation-environment WAYLAND_DISPLAY DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_DESKTOP QT_QPA_PLATFORM QT_QPA_PLATFORMTHEME XKB_CONFIG_EXTRA_PATH LIBVA_DRIVER_NAME NVD_BACKEND __GLX_VENDOR_LIBRARY_NAME ELECTRON_OZONE_PLATFORM_HINT GDK_BACKEND SDL_VIDEODRIVER CLUTTER_BACKEND XCURSOR_THEME XCURSOR_SIZE EDITOR VISUAL PATH
exec-once=gentoo-pipewire-launcher
exec-once=gnome-keyring-daemon --start --components=secrets,pkcs11
exec-once=/usr/libexec/polkit-gnome-authentication-agent-1
exec-once=swaybg -i "${XDG_DATA_HOME:-$HOME/.local/share}/backgrounds/fantasy-woods.jpg" -m fill
exec-once=mako
exec-once=playerctld daemon
exec-once=udiskie --tray
exec-once=blueman-applet
exec-once=wl-paste --type text --watch cliphist -max-items 50 -max-dedupe-search 50 store
exec-once=sh -c 'mkdir -p "$XDG_RUNTIME_DIR/podman"; exec podman system service --time=0 "unix://$XDG_RUNTIME_DIR/podman/podman.sock"'
exec-once=wezterm-mux-server --config-file "${XDG_CONFIG_HOME:-$HOME/.config}/wezterm/wezterm.lua"
exec-once=swayidle -w timeout 600 'lock-session' timeout 900 "wlopm --off '*'" resume "wlopm --on '*'" timeout 1800 'lock-session && loginctl suspend' lock 'lock-session' before-sleep 'lock-session' after-resume "wlopm --on '*'"
exec-once=sh -c 'while mmsg -g >/dev/null 2>&1; do reminder dispatch || true; sleep 60; done'
exec-once=waybar

# General
borderpx=2
border_radius=0
gappih=4
gappiv=4
gappoh=4
gappov=4
smartgaps=0
rootcolor=0x131210ff
bordercolor=0x58534cff
focuscolor=0xe17a3fff
urgentcolor=0xb34a45ff
scratchpadcolor=0x879b5cff
globalcolor=0x6785a1ff
overlaycolor=0x879b5cff
maximizescreencolor=0xe17a3fff
dropcolor=0x879b5c88
splitcolor=0xe17a3fff

xkb_rules_layout=aileks
repeat_rate=50
repeat_delay=250
mouse_accel_profile=1
cursor_size=24
cursor_theme=Adwaita

blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=5
shadows=1
layer_shadows=0
shadow_only_floating=0
focused_opacity=1.0
unfocused_opacity=0.95
animations=0
layer_animations=0
animation_fade_in=0
animation_fade_out=0
animation_duration_focus=0

# Layout
tag_num=7
default_mfact=0.5
default_nmaster=1
new_is_master=0
circle_layout=tile,monocle
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_hotarea=0
enable_floating_snap=1
snap_distance=32
drag_tile_to_tile=1
idleinhibit_ignore_visible=0
scratchpad_cross_monitor=1
single_scratchpad=1

# Rules
tagrule=id:*,layout_name:tile

windowrule=appid:^org.wezfurlong.wezterm$,isterm:1
windowrule=appid:^imv$,isfloating:1
windowrule=appid:^org.gnome.Calculator$,isfloating:1
windowrule=appid:^[Qq]alculate-gtk$,isfloating:1
windowrule=appid:^(org\.blueman\.(Manager|Adapters|Services)|blueman-manager)$,isfloating:1
windowrule=appid:^[Bb]itwarden$,isfloating:1
windowrule=appid:^(org\.localsend\.localsend_app|[Ll]ocal[Ss]end|localsend_app)$,isfloating:1
windowrule=appid:^polkit-gnome.*,isfloating:1
windowrule=appid:^(xdg-desktop-portal-gtk|org\.freedesktop\.impl\.portal\.desktop\.gtk)$,isfloating:1
windowrule=appid:^mpv$,focused_opacity:1.0,unfocused_opacity:1.0

# Keybinds
bind=SUPER,space,spawn,app-launcher
bind=SUPER,Return,spawn,wezterm connect unix
bind=SUPER,t,spawn,wezterm-dmenu
bind=SUPER,w,spawn,zen-browser
bind=SUPER,e,spawn,wezterm start --always-new-process -- yazi
bind=SUPER,s,spawn,signal-desktop
bind=SUPER,a,spawn,wezterm start --always-new-process -- wiremix
bind=SUPER,m,spawn,fastmail
bind=SUPER,o,spawn,color-picker
bind=SUPER,v,spawn,clipboard-menu
bind=SUPER,semicolon,spawn,bemoji -n
bind=SUPER,Escape,spawn,lock-session
bind=SUPER,n,spawn,dnd-toggle
bind=SUPER+CTRL,n,spawn,night-light
bind=SUPER+SHIFT,p,spawn,power-menu
bind=SUPER,r,spawn,screenrecord menu
bind=NONE,Print,spawn,screenshot region
bind=CTRL,Print,spawn,screenshot window
bind=SHIFT,Print,spawn,screenshot full
bind=SUPER,Print,spawn,screenrecord region
bind=SUPER+SHIFT,Print,spawn,screenrecord output
bind=SUPER+CTRL,space,spawn,desktop-actions
bind=SUPER+SHIFT,o,spawn,region-ocr
bind=SUPER+CTRL,o,spawn,qr-scan
bind=SUPER+CTRL,r,spawn,reminder
bind=SUPER,equal,spawn,calculate
bind=SUPER+SHIFT,n,spawn,makoctl restore
bind=SUPER+CTRL+SHIFT,n,spawn,makoctl dismiss -a

bind=SUPER,q,killclient
bind=SUPER,f,togglefullscreen
bind=SUPER+SHIFT,space,togglefloating
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right
bind=SUPER+SHIFT,j,exchange_stack_client,next
bind=SUPER+SHIFT,k,exchange_stack_client,prev
bind=SUPER+CTRL,h,setmfact,-0.05
bind=SUPER+CTRL,l,setmfact,+0.05
bind=SUPER+CTRL,j,resizewin,+0,+40
bind=SUPER+CTRL,k,resizewin,+0,-40
bind=SUPER,i,incnmaster,+1
bind=SUPER+SHIFT,i,incnmaster,-1
bind=SUPER+SHIFT,Return,zoom
bind=SUPER,Tab,view,-1,0
bind=SUPER,grave,toggle_scratchpad
bind=SUPER+SHIFT,grave,minimized
bind=SUPER+CTRL,grave,restore_minimized,0
bind=SUPER+SHIFT,q,quit
bind=SUPER+SHIFT,r,reload_config

bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioPause,spawn,playerctl play-pause
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86AudioRaiseVolume,spawn,audio sink up
bind=NONE,XF86AudioLowerVolume,spawn,audio sink down
bind=NONE,XF86AudioMute,spawn,audio sink mute
bind=NONE,XF86AudioMicMute,spawn,audio mic mute
bind=NONE,XF86MonBrightnessUp,spawn,brightness up
bind=NONE,XF86MonBrightnessDown,spawn,brightness down

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_middle,togglefloating
mousebind=SUPER,btn_right,moveresize,curresize
axisbind=SUPER,UP,focusstack,prev
axisbind=SUPER,DOWN,focusstack,next

bind=SUPER,1,view,1
bind=SUPER+CTRL,1,toggleview,1
bind=SUPER+SHIFT,1,tagsilent,1
bind=SUPER+CTRL+SHIFT,1,toggletag,1
bind=SUPER,2,view,2
bind=SUPER+CTRL,2,toggleview,2
bind=SUPER+SHIFT,2,tagsilent,2
bind=SUPER+CTRL+SHIFT,2,toggletag,2
bind=SUPER,3,view,3
bind=SUPER+CTRL,3,toggleview,3
bind=SUPER+SHIFT,3,tagsilent,3
bind=SUPER+CTRL+SHIFT,3,toggletag,3
bind=SUPER,4,view,4
bind=SUPER+CTRL,4,toggleview,4
bind=SUPER+SHIFT,4,tagsilent,4
bind=SUPER+CTRL+SHIFT,4,toggletag,4
bind=SUPER,5,view,5
bind=SUPER+CTRL,5,toggleview,5
bind=SUPER+SHIFT,5,tagsilent,5
bind=SUPER+CTRL+SHIFT,5,toggletag,5
bind=SUPER,6,view,6
bind=SUPER+CTRL,6,toggleview,6
bind=SUPER+SHIFT,6,tagsilent,6
bind=SUPER+CTRL+SHIFT,6,toggletag,6
bind=SUPER,7,view,7
bind=SUPER+CTRL,7,toggleview,7
bind=SUPER+SHIFT,7,tagsilent,7
bind=SUPER+CTRL+SHIFT,7,toggletag,7
