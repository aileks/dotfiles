# Environment
env=PATH,~/.local/bin:~/.config/emacs/bin:/usr/local/sbin:/usr/local/bin:/usr/bin:/opt/bin:/usr/lib/llvm/22/bin:/usr/lib/llvm/20/bin
env=NPM_CONFIG_PREFIX,~/.local
env=XDG_CURRENT_DESKTOP,mango
env=XDG_SESSION_DESKTOP,mango
env=XDG_SESSION_TYPE,wayland
env=SSH_AUTH_SOCK,~/.bitwarden-ssh-agent.sock
env=XCURSOR_THEME,Adwaita
env=XCURSOR_SIZE,24
env=LIBVA_DRIVER_NAME,nvidia
env=NVD_BACKEND,direct
env=MOZ_ENABLE_WAYLAND,1
env=QT_QPA_PLATFORMTHEME,qt6ct
env=EDITOR,nvim
env=VISUAL,nvim
env=BEMOJI_PICKER_CMD,rofi -dmenu -i -p Emoji
env=BEMOJI_CLIP_CMD,wl-copy
env=CLIPHIST_MAX_ITEMS,20
exec-once=exec ~/.config/mango/autostart.sh

# Tiling
tag_num=7
tag_gather=0
tagrule=id:*,layout_name:tile
default_mfact=0.50
default_nmaster=1
new_is_master=1
center_when_single_stack=0

# Appearance
gappih=4
gappiv=4
gappoh=4
gappov=4
smartgaps=0
borderpx=2
no_border_when_single=0
border_radius=0
rootcolor=0x131210ff
bordercolor=0x58534cff
focuscolor=0xe17a3fff
urgentcolor=0xb34a45ff
blur=0
blur_layer=0
shadows=0
layer_shadows=0
animations=0
layer_animations=0
focused_opacity=1
unfocused_opacity=1
enable_hotarea=0

# Input
xkb_rules_layout=custom
repeat_rate=50
repeat_delay=250
sloppyfocus=1
warpcursor=0
mouse_accel_profile=1
mouse_accel_speed=0
mouse_natural_scrolling=0
mouse_left_handed=0
mouse_middle_button_emulation=0
mouse_scroll_method=1
mouse_click_method=1
trackpad_accel_profile=1
trackpad_accel_speed=0
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
trackpad_scroll_method=1
trackpad_click_method=1
button_map=0
cursor_theme=Adwaita
cursor_size=24
idleinhibit_ignore_visible=0

# Window Rules
windowrule=appid:^(imv|qalculate-gtk|org.localsend.localsend_app|xdg-desktop-portal-gtk|nm-connection-editor|polkit-gnome|blueman-manager|bitwarden)$,isfloating:1

# Applications
bind=Super,Return,spawn,wezterm connect unix
bind=Super,t,spawn,wezterm-workspaces
bind=Super,space,spawn,rofi -show drun
bind=Super,x,spawn,emacsclient -c -a ""
bind=Super,w,spawn,zen-browser
bind=Super,e,spawn,wezterm start --always-new-process -- yazi
bind=Super,s,spawn,signal-desktop
bind=Super,a,spawn,wezterm start --always-new-process -- wiremix
bind=Super,o,spawn,pick-color
bind=Super,semicolon,spawn,bemoji -n
bind=Super,equal,spawn,qalculate-gtk
bind=Super,v,spawn_shell,s=$(cliphist list | rofi -dmenu -i -p Clipboard) && [ -n "$s" ] && f=$(mktemp "$XDG_RUNTIME_DIR/clip.XXXXXX") && trap 'rm -f "$f"' EXIT && printf '%s\n' "$s" | cliphist decode >"$f" && [ -s "$f" ] && wl-copy <"$f"

# Capture
bind=None,Print,spawn,screenshot region
bind=Ctrl,Print,spawn,screenshot window
bind=Shift,Print,spawn,screenshot full
bind=Super+Shift,o,spawn,region-ocr
bind=Super,r,spawn,screenrecord menu
bind=Super,Print,spawn,screenrecord region
bind=Super+Shift,Print,spawn,screenrecord output

# Session
bind=Super,Escape,spawn,lock-session
bind=Super+Shift,p,spawn,power-menu
bind=Super+Shift,q,quit
bind=Super+Shift,r,reload_config
bind=Super,b,spawn_shell,pkill -USR1 -u "$(id -u)" --env "MANGO_INSTANCE_SIGNATURE=$MANGO_INSTANCE_SIGNATURE" -x waybar
bind=Super,n,spawn_shell,dunstctl set-paused toggle && state=$(dunstctl is-paused) && swayosd-client --custom-message "Do not disturb: $state"
bind=Super+Ctrl+Shift,n,spawn,dunstctl context

# Audio
bind=None,XF86AudioRaiseVolume,spawn,swayosd-client --output-volume +5 --max-volume 100
bind=None,XF86AudioLowerVolume,spawn,swayosd-client --output-volume -5 --max-volume 100
bind=None,XF86AudioMute,spawn,swayosd-client --output-volume mute-toggle
bind=None,XF86AudioMicMute,spawn,swayosd-client --input-volume mute-toggle
bind=None,XF86AudioPlay,spawn,playerctl play-pause
bind=None,XF86AudioPause,spawn,playerctl play-pause
bind=None,XF86AudioNext,spawn,playerctl next
bind=None,XF86AudioPrev,spawn,playerctl previous

# Brightness
env=BRIGHTNESS_OSD,swayosd-client --custom-icon display-brightness-symbolic
bind=None,XF86MonBrightnessUp,spawn_shell,v=$(ddcutil setvcp 10 + 10 >&2 && ddcutil getvcp 10 -t) && p=$(printf '%s\n' "$v" | awk '/^VCP 10 C [0-9]+ [0-9]+$/ && $5>0 && $4<=$5 {print $4/$5}') && [ -n "$p" ] && $BRIGHTNESS_OSD --custom-progress "$p"
bind=None,XF86MonBrightnessDown,spawn_shell,v=$(ddcutil setvcp 10 - 10 >&2 && ddcutil getvcp 10 -t) && p=$(printf '%s\n' "$v" | awk '/^VCP 10 C [0-9]+ [0-9]+$/ && $5>0 && $4<=$5 {print $4/$5}') && [ -n "$p" ] && $BRIGHTNESS_OSD --custom-progress "$p"

# Windows
bind=Super,q,killclient
bind=Super,f,togglefullscreen
bind=Super+Shift,space,togglefloating
bind=Super,j,focusstack,next
bind=Super,k,focusstack,prev
bind=Super+Shift,j,exchange_stack_client,next
bind=Super+Shift,k,exchange_stack_client,prev
bind=Super,h,setmfact,-0.05
bind=Super,l,setmfact,+0.05
bind=Super,i,incnmaster,1
bind=Super+Shift,i,incnmaster,-1
bind=Super,comma,focusmon,left
bind=Super,period,focusmon,right
bind=Super+Shift,comma,tagmon,left
bind=Super+Shift,period,tagmon,right
bind=Super+Alt,0,togglegaps
bind=Super+Ctrl,Return,zoom
mousebind=Super,btn_left,moveresize,curmove
mousebind=Super,btn_middle,togglefloating
mousebind=Super,btn_right,moveresize,curresize

# Tags
bind=Super,1,view,1
bind=Super+Ctrl,1,toggleview,1
bind=Super+Shift,1,tag,1
bind=Super+Ctrl+Shift,1,toggletag,1
bind=Super,2,view,2
bind=Super+Ctrl,2,toggleview,2
bind=Super+Shift,2,tag,2
bind=Super+Ctrl+Shift,2,toggletag,2
bind=Super,3,view,3
bind=Super+Ctrl,3,toggleview,3
bind=Super+Shift,3,tag,3
bind=Super+Ctrl+Shift,3,toggletag,3
bind=Super,4,view,4
bind=Super+Ctrl,4,toggleview,4
bind=Super+Shift,4,tag,4
bind=Super+Ctrl+Shift,4,toggletag,4
bind=Super,5,view,5
bind=Super+Ctrl,5,toggleview,5
bind=Super+Shift,5,tag,5
bind=Super+Ctrl+Shift,5,toggletag,5
bind=Super,6,view,6
bind=Super+Ctrl,6,toggleview,6
bind=Super+Shift,6,tag,6
bind=Super+Ctrl+Shift,6,toggletag,6
bind=Super,7,view,7
bind=Super+Ctrl,7,toggleview,7
bind=Super+Shift,7,tag,7
bind=Super+Ctrl+Shift,7,toggletag,7
