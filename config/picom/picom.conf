# vsync is handled here, so ForceCompositionPipeline must stay off (never both).

backend = "egl";
vsync = true;
xrender-sync-fence = true;
use-damage = false;

shadow = true;
shadow-radius = 14;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-opacity = 0.4;
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
];

fading = false;

inactive-opacity = 0.95;
active-opacity = 1.0;
opacity-rule = [
  "100:class_g = 'mpv'",
];

blur: {
  method = "dual_kawase";
  strength = 5;
}
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "class_g = 'slop'",
];
