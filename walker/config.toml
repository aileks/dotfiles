theme = "cinder-grove"
close_when_open = true
selection_wrap = true
hide_quick_activation = true

[placeholders]
default = { input = "Search applications", list = "No applications found" }
clipboard = { input = "Search clipboard", list = "Clipboard is empty" }

[providers]
default = ["desktopapplications"]
empty = ["desktopapplications"]
max_results = 30

[[providers.prefixes]]
prefix = ":"
provider = "clipboard"
