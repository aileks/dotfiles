[Service]
Environment="VOXTYPE_VULKAN_DEVICE=nvidia"
Environment="VK_LOADER_DRIVERS_SELECT=nvidia*"
# The automatic ONNX selector prefers the AMD iGPU on this dual-GPU machine.
# Use the CUDA 13 binary directly so package upgrades cannot switch the daemon
# back to the unavailable MIGraphX backend.
ExecStart=
ExecStart=/usr/lib/voxtype/cuda-13/voxtype-onnx-cuda-13 -q daemon
