COMMON_FLAGS="-march=znver5 -O3 -flto=auto -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
LDFLAGS="${LDFLAGS} -Wl,-O2 -Wl,--as-needed -fuse-ld=lld"
RUSTFLAGS="${RUSTFLAGS} -C target-cpu=znver5 -C opt-level=3 -C linker-plugin-lto"

LC_MESSAGES=C.UTF-8
L10N="en en-US"

MAKEOPTS="-j20 -l20"
EMERGE_DEFAULT_OPTS="--jobs=2 --load-average=20 --keep-going --with-bdeps=y"
FEATURES="${FEATURES} ccache"
CCACHE_SIZE="16G"
USE="dist-kernel X vaapi pipewire pipewire-alsa dbus xft sound-server x265 minizip elogind -wayland"
CPU_FLAGS_X86="aes avx avx2 avx512_bf16 avx512_bitalg avx512_vbmi2 avx512_vnni avx512_vp2intersect avx512_vpopcntdq avx512bw avx512cd avx512dq avx512f avx512ifma avx512vbmi avx512vl avx_vnni bmi1 bmi2 f16c fma3 mmx mmxext pclmul popcnt rdrand sha sse sse2 sse3 sse4_1 sse4_2 sse4a ssse3 vpclmulqdq"

GENTOO_MIRRORS="http://www.gtlib.gatech.edu/pub/gentoo \
    https://mirrors.kernel.org/gentoo/ \
    https://mirror.rackspace.com/gentoo/"

ACCEPT_LICENSE="-* @FREE @BINARY-REDISTRIBUTABLE @EULA"
ACCEPT_KEYWORDS="~amd64"
